<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoDeck Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .bg-blur {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(40px) brightness(0.3);
      transform: scale(1.1);
      z-index: 1;
      transition: background-image 0.5s ease;
    }

    .player-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 15px 20px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .media-info {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .album-art {
      width: 65px;
      height: 65px;
      border-radius: 12px;
      object-fit: cover;
      background-color: #222;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .track-details {
      display: flex;
      flex-direction: column;
    }

    .track-title {
      font-size: 1.2rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 300px;
    }

    .track-artist {
      font-size: 0.9rem;
      color: #ccc;
      margin-top: 2px;
    }

    .lyrics-container {
      flex: 1;
      overflow-y: auto;
      text-align: center;
      padding: 20px 0;
      scroll-behavior: smooth;
      mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
    }

    .lyrics-container::-webkit-scrollbar {
      display: none;
    }

    .lyric-line {
      font-size: 1.1rem;
      color: #777;
      margin: 16px 0;
      transition: all 0.3s ease;
    }

    .lyric-line.active {
      color: #fff;
      font-size: 1.3rem;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
  </style>
</head>
<body>

  <div class="bg-blur" id="bg-blur"></div>

  <div class="player-container">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.href='timonauto.html'">← Dashboard</button>
    </div>

    <div class="media-info">
      <img id="album-art" class="album-art" alt="Cover" src="">
      <div class="track-details">
        <div class="track-title" id="track-title">Waiting for YouTube Music...</div>
        <div class="track-artist" id="track-artist">--</div>
      </div>
    </div>

    <div class="lyrics-container" id="lyrics-container">
      <div class="lyric-line active">Syncing lyrics...</div>
    </div>
  </div>

  <script>
    const albumArt = document.getElementById('album-art');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const bgBlur = document.getElementById('bg-blur');
    const lyricsContainer = document.getElementById('lyrics-container');

    let parsedLyrics = [];

    // Parse standard .lrc format string into an array of objects: [{time: seconds, text: string}]
    function parseLrc(lrcString) {
      if (!lrcString) return [];
      const lines = lrcString.split('\n');
      const result = [];
      const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

      for (let line of lines) {
        const match = timeRegex.exec(line);
        if (match) {
          const minutes = parseInt(match[1], 10);
          const seconds = parseInt(match[2], 10);
          const milliseconds = parseInt(match[3], 10) * (match[3].length === 2 ? 10 : 1);
          const totalSeconds = minutes * 60 + seconds + milliseconds / 1000;
          const text = line.replace(timeRegex, '').trim();
          if (text) {
            result.push({ time: totalSeconds, text: text });
          }
        }
      }
      return result;
    }

    // Global listener called by Kotlin's evaluateJavascript
    window.loadSongData = function(song) {
      console.log("Song received:", song);

      trackTitle.innerText = song.title || 'Unknown Title';
      trackArtist.innerText = song.artist || 'Unknown Artist';

      if (song.coverUrl) {
        albumArt.src = song.coverUrl;
        bgBlur.style.backgroundImage = `url('${song.coverUrl}')`;
      }

      // Parse lyrics and render to DOM
      parsedLyrics = parseLrc(song.lrcLyrics);
      renderLyricsHtml();
    };

    function renderLyricsHtml() {
      if (parsedLyrics.length === 0) {
        lyricsContainer.innerHTML = `<div class="lyric-line active">No synchronized lyrics available</div>`;
        return;
      }

      let html = '';
      parsedLyrics.forEach((item, index) => {
        html += `<div class="lyric-line" id="lyric-${index}">${item.text}</div>`;
      });
      lyricsContainer.innerHTML = html;
    }

    // Optional: If you want to simulate lyrics progression or tie it back 
    // to a playback timestamp passed from Kotlin later on.
    window.updatePlaybackTime = function(currentTimeSeconds) {
      if (parsedLyrics.length === 0) return;

      let activeIndex = 0;
      for (let i = 0; i < parsedLyrics.length; i++) {
        if (parsedLyrics[i].time <= currentTimeSeconds) {
          activeIndex = i;
        } else {
          break;
        }
      }

      // Highlight active line and scroll it into view
      document.querySelectorAll('.lyric-line').forEach((el, idx) => {
        if (idx === activeIndex) {
          el.classList.add('active');
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          el.classList.remove('active');
        }
      });
    };
  </script>
</body>
</html>
