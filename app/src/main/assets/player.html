<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoDeck Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .bg-blur {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(40px) brightness(0.3);
      transform: scale(1.1);
      z-index: 1;
      transition: background-image 0.5s ease;
    }

    .player-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 15px 20px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .media-info {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 12px;
    }

    .album-art {
      width: 65px;
      height: 65px;
      border-radius: 12px;
      object-fit: cover;
      background-color: #222;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .track-details {
      display: flex;
      flex-direction: column;
    }

    .track-title {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .track-artist {
      font-size: 0.9rem;
      color: #ccc;
      margin-top: 2px;
    }

    .controls-section {
      margin-bottom: 12px;
    }

    .progress-bar-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: #aaa;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
    }

    .progress-bar::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-top: 8px;
    }

    .btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
    }

    .btn-play {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1rem;
    }

    .lyrics-container {
      flex: 1;
      overflow-y: auto;
      text-align: center;
      mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
      padding: 30px 10px;
    }

    .lyrics-container::-webkit-scrollbar {
      display: none;
    }

    .lyric-line {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.4);
      margin: 16px 0;

      font-weight: 500;
