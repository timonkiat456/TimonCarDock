<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoDeck Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Motion Album Art Background */
    .bg-blur {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background-size: cover;
      background-position: center;
      background-image: linear-gradient(135deg, #1a1a1a, #0a0a0a);
      filter: blur(50px) brightness(0.35);
      z-index: 1;
      transition: background-image 0.8s ease-in-out;
      animation: ambientPan 20s infinite alternate ease-in-out;
    }

    @keyframes ambientPan {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.12) translate(-2%, -2%); }
    }

    .player-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px 24px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    .media-info {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .album-art {
      width: 68px;
      height: 68px;
      border-radius: 12px;
      object-fit: cover;
      background-color: #222;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }

    .track-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .track-title {
      font-size: 1.25rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
    }

    .track-artist {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Scrolling Lyrics Container */
    .lyrics-container {
      flex: 1;
      overflow-y: auto;
      text-align: center;
      padding: 40vh 15px;
      scroll-behavior: smooth;
      mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
    }

    .lyrics-container::-webkit-scrollbar {
      display: none;
    }

    .lyric-line {
      font-size: 1.15rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.35);
      margin: 22px 0;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      transform: scale(0.95);
      line-height: 1.4;
    }

    .lyric-line.active {
      color: #ffffff;
      font-size: 1.45rem;
      font-weight: 800;
      transform: scale(1.05);
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>

  <div class="bg-blur" id="bg-blur"></div>

  <div class="player-container">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.href='timonauto.html'">← Dashboard</button>
    </div>

    <div class="media-info">
      <img id="album-art" class="album-art" alt="Cover" src="">
      <div class="track-details">
        <div class="track-title" id="track-title">Waiting for YouTube Music...</div>
        <div class="track-artist" id="track-artist">--</div>
      </div>
    </div>

    <div class="lyrics-container" id="lyrics-container">
      <div class="lyric-line active">Syncing lyrics...</div>
    </div>
  </div>

    <script>
    const albumArt = document.getElementById('album-art');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const bgBlur = document.getElementById('bg-blur');
    const lyricsContainer = document.getElementById('lyrics-container');

    let parsedLyrics = [];
    let currentActiveIndex = -1;
    let internalPlaybackTimer = null;
    let simulatedSeconds = 0;

    function parseLrc(lrcString) {
      if (!lrcString) return [];
      const lines = lrcString.split('\n');
      const result = [];
      const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

      for (let line of lines) {
        const match = timeRegex.exec(line);
        if (match) {
          const minutes = parseInt(match[1], 10);
          const seconds = parseInt(match[2], 10);
          const milliseconds = parseInt(match[3], 10) * (match[3].length === 2 ? 10 : 1);
          const totalSeconds = minutes * 60 + seconds + milliseconds / 1000;
          const text = line.replace(timeRegex, '').trim();
          if (text) {
            result.push({ time: totalSeconds, text: text });
          }
        }
      }
      return result;
    }

    window.loadSongData = function(song) {
      trackTitle.innerText = song.title || 'Unknown Title';
      trackArtist.innerText = song.artist || 'Unknown Artist';

      if (song.coverUrl && song.coverUrl.trim() !== "") {
        albumArt.src = song.coverUrl;
        bgBlur.style.backgroundImage = `url('${song.coverUrl}')`;
        albumArt.style.display = 'block';
      } else {
        albumArt.src = '';
        bgBlur.style.backgroundImage = 'linear-gradient(135deg, #1a1a1a, #0a0a0a)';
      }

      parsedLyrics = parseLrc(song.lrcLyrics);
      currentActiveIndex = -1;
      simulatedSeconds = 0;
      renderLyricsHtml();

      // Start local fallback timer in case Android doesn't stream live positions
      if (internalPlaybackTimer) clearInterval(internalPlaybackTimer);
      internalPlaybackTimer = setInterval(() => {
        simulatedSeconds += 0.5;
        updatePlaybackTime(simulatedSeconds);
      }, 500);
    };

    function renderLyricsHtml() {
      if (parsedLyrics.length === 0) {
        lyricsContainer.innerHTML = `<div class="lyric-line active">No synchronized lyrics available</div>`;
        return;
      }

      let html = '';
      parsedLyrics.forEach((item, index) => {
        html += `<div class="lyric-line" id="lyric-${index}">${item.text}</div>`;
      });
      lyricsContainer.innerHTML = html;
    }

    window.updatePlaybackTime = function(currentTimeSeconds) {
      if (parsedLyrics.length === 0) return;

      // Sync local ticker if Kotlin passes a valid non-zero timestamp
      if (currentTimeSeconds > 0 && Math.abs(currentTimeSeconds - simulatedSeconds) > 2) {
        simulatedSeconds = currentTimeSeconds;
      }

      let activeIndex = 0;
      for (let i = 0; i < parsedLyrics.length; i++) {
        if (parsedLyrics[i].time <= simulatedSeconds) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== currentActiveIndex) {
        currentActiveIndex = activeIndex;

        const allLines = document.querySelectorAll('.lyric-line');
        allLines.forEach((el, idx) => {
          if (idx === activeIndex) {
            el.classList.add('active');
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } else {
            el.classList.remove('active');
          }
        });
      }
    };
  </script>

</body>
</html>
