<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoDeck Player (Debug)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .bg-blur {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(40px) brightness(0.3);
      transform: scale(1.1);
      z-index: 1;
      transition: background-image 0.5s ease;
    }

    .player-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 15px 20px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .media-info {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 12px;
    }

    .album-art {
      width: 65px;
      height: 65px;
      border-radius: 12px;
      object-fit: cover;
      background-color: #222;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .track-details {
      display: flex;
      flex-direction: column;
    }

    .track-title {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .track-artist {
      font-size: 0.9rem;
      color: #ccc;
      margin-top: 2px;
    }

    .lyrics-container {
      flex: 1;
      overflow-y: auto;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .status-box {
      font-size: 1.2rem;
      color: #00ffcc;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.1);
      padding: 15px 25px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="bg-blur" id="bg-blur"></div>

  <div class="player-container">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.href='timonauto.html'">← Dashboard</button>
    </div>

    <div class="media-info">
      <img id="album-art" class="album-art" alt="Cover" src="">
      <div class="track-details">
        <div class="track-title" id="track-title">Waiting for YouTube Music...</div>
        <div class="track-artist" id="track-artist">--</div>
      </div>
    </div>

    <div class="lyrics-container">
      <div class="status-box" id="status-box">Listening for song metadata...</div>
    </div>
  </div>

  <script>
    const albumArt = document.getElementById('album-art');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const bgBlur = document.getElementById('bg-blur');
    const statusBox = document.getElementById('status-box');

    // Global listener called by Kotlin's evaluateJavascript
    window.loadSongData = function(song) {
      console.log("Data received from Kotlin:", song);

      trackTitle.innerText = song.title || 'Unknown Title';
      trackArtist.innerText = song.artist || 'Unknown Artist';

      if (song.coverUrl) {
        albumArt.src = song.coverUrl;
        bgBlur.style.backgroundImage = `url('${song.coverUrl}')`;
      }

      statusBox.innerText = `Connected! Playing: "${song.title}" by ${song.artist}`;
      statusBox.style.color = "#00ffcc";
    };
  </script>
</body>
</html>
